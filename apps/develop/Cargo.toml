[package]
name = "develop"
description = "Develop desktop app: Lightroom-style photo editing, one photo at a time, beside Omina Motion and Omina Edit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
# The channel that hands files the system asks to open over to the window.
futures = "0.3"
develop-core.workspace = true
iris.workspace = true
gpui-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
# The same image library GPUI uses, for handing it rendered pictures.
image.workspace = true

# Packaging into Develop.app with cargo-packager (the same setup as Studio and Canvas).
[package.metadata.packager]
product-name = "Omina Develop"
identifier = "com.oddomens.develop"
publisher = "Odd Omens LLC"
category = "Photography"
description = "Lightroom-style photo editing: white balance, tone, color, detail, crop and straighten, masks, presets and snapshots."
copyright = "Copyright © 2026 Odd Omens LLC. Free software under the GNU GPL, version 3 or later."
license-file = "../../LICENSE"
icons = ["../../assets/icon/develop-512@2x.png", "../../assets/icon/develop-512.png", "../../assets/icon/develop-256@2x.png", "../../assets/icon/develop-256.png", "../../assets/icon/develop-128@2x.png", "../../assets/icon/develop-128.png", "../../assets/icon/develop-32@2x.png", "../../assets/icon/develop-32.png", "../../assets/icon/develop-16@2x.png", "../../assets/icon/develop-16.png"]
out-dir = "../../target/packages"
binaries-dir = "../../target/release"
binaries = [{ path = "develop", main = true }]
resources = ["../../LICENSE", "../../assets/icon/omid-document.icns"]

# Double-clicking a project opens it in Omina Develop. Windows and Linux installers register this;
# on macOS, Info.plist declares the file type in full (it replaces what this would write).
# Projects are .omid; .develop is the older extension, still opened.
[[package.metadata.packager.file-associations]]
extensions = ["omid", "develop"]
name = "Omina Develop Project"
description = "Omina Develop Project"
mime-type = "application/x-omina-develop"
role = "editor"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
# Extra Info.plist keys: the project file type this app opens.
info-plist-path = "Info.plist"

[lints]
workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
